name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # pull-requests: write は MCP の github_inline_comment（行単位レビューコメント投稿）
      # で必須。/review-pr スラッシュコマンドが 5 サブエージェントから並列で
      # mcp__github_inline_comment__create_inline_comment を呼ぶため、write 権限が要る。
      #
      # ⚠️ 設計トレードオフ: この権限は @claude メンション全てに付与される。
      # /review-pr 以外（雑談・README 要約 等）でも write 権限を持つことになるが、
      # claude-code-action は PR コンテキスト判定で inline_comment ツールを自動的に
      # 解放/制限する設計のため、実害リスクは小さい。
      # 将来 job 分割でレビュー専用 job に絞る案は残り課題。
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # /review-pr が `git diff origin/${BASE}...HEAD`（BASE は gh pr view で動的取得）で
          # 差分計算するため、shallow ではなく全履歴を取得する。
          # ⚠️ 設計トレードオフ: この設定も全 @claude トリガーに適用される。通常のリポジトリ
          # サイズなら fetch-depth: 0 でも数秒なので実害は小さい。リポジトリが巨大化した場合は
          # /review-pr 専用 job に切り出して fetch-depth を使い分ける余地あり。
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
